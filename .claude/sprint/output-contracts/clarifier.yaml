# phase-advance-eval.sh 側のファイル存在判定に委ね、契約では作話兆候のみ検査する。
required_artifacts: []
required_state_updates: []
forbidden_patterns:
  - "おそらく"
  - "たぶん"
  - "完了したつもり"
  - "やってない"
  - "存在しないと思う"
